<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 816" width="392" height="816" role="img" aria-labelledby="t d"><title id="t">Who gets July under three ways of sharing</title><desc id="d">Hypothetical example of the four July weeks over three years for Groups A, B and C. With fixed weeks, Group B has all of July every year. With turns in a rotation, July moves to different groups each year. In a draft whose pick order rotates, the July weeks are split across the groups and change hands each year.</desc><rect width="392" height="816" rx="16" fill="#faf6ef"/><text x="24" y="40" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#a84e32" text-anchor="start" letter-spacing="2.4">WHO GETS JULY?</text><text x="24" y="72" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#10242b" text-anchor="start">Three groups, three years</text><text x="127.0" y="100" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6b6b" text-anchor="middle">Wk 1</text><text x="195.0" y="100" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6b6b" text-anchor="middle">Wk 2</text><text x="263.0" y="100" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6b6b" text-anchor="middle">Wk 3</text><text x="331.0" y="100" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6b6b" text-anchor="middle">Wk 4</text><text x="24" y="142" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#10242b" text-anchor="start">Fixed weeks</text><text x="24" y="166" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5b6b6b" text-anchor="start">Group B has July every year</te